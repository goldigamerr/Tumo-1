<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Macro Space Panel</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #000;
      color: #fff;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    .header {
      background: linear-gradient(90deg, #87CEEB, #5FB9E0);
      color: #000;
      text-align: center;
      padding: 18px 12px;
      font-size: 24px;
      font-weight: bold;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }

    .video-container {
      width: 100%;
      margin-bottom: 20px;
      border-radius: 12px;
      overflow: hidden;
    }

    .video-container video {
      display: block;
      width: 100%;
      height: auto;
    }

    .app-card {
      background: #111;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
    }

    .app-card h2 {
      margin-bottom: 12px;
      font-size: 22px;
    }

    .app-card p {
      margin-bottom: 20px;
      color: #ccc;
      font-size: 15px;
    }

    .install-btn {
      display: inline-block;
      width: 100%;
      padding: 14px 20px;
      background: linear-gradient(90deg, #87CEEB, #5FB9E0);
      color: #000;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      transition: opacity 0.2s ease;
    }

    .install-btn:hover {
      opacity: 0.85;
    }
  </style>
</head>

<body>
  <header class="header">Macro Space Panel</header>

  <main class="container">
    <div class="video-container">
      <video controls playsinline>
        <source src="YOUR_VIDEO_URL_HERE" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </div>

    <section class="app-card">
      <h2>Macro Space</h2>
      <p>Click the button below to install.</p>
      <a
        class="install-btn"
        href="https://terasharelink.com/s/1HxD3iix-lrpndpLuEPY-qA"
        target="_blank"
        rel="noopener noreferrer"
      >Install</a>
    </section>
  </main>
</body>
</html>
